version: '3.8'

services:
  investigate-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investigate-agent-app
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - SQLITE_DB_PATH=/app/data/investigate-agent.db
    volumes:
      - investigate-data:/app/data

volumes:
  investigate-data:
    driver: local
